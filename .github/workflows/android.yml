name: Android CI

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check the runner's installed Android 36 SDK
        run: |
          test -f "${ANDROID_HOME:?}/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Check public certificate document generation
        run: node --test scripts/assetlinks.test.mjs
      - name: Build test APK and unsigned release bundle; run release lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease :app:lintRelease testDebugUnitTest

# No deployment, signing secret, billing credential or purchase occurs in CI.
