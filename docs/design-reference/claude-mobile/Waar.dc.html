<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>RIG waar moet het gebeuren</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8fe3b8}a:hover{color:#b6f0d2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #101416; color: #eef2f0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Kies.dc.html" aria-label="Terug" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eef2f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 13px; color: #a9b3b0">Stap 2 van 3</span>
    <span style="width: 32px"></span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: -10px">
    <div style="height: 4px; border-radius: 2px; background: #8fe3b8"></div>
    <div style="height: 4px; border-radius: 2px; background: #8fe3b8"></div>
    <div style="height: 4px; border-radius: 2px; background: #2e383c"></div>
  </div>

  <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1">Waar moet het gebeuren?</h1>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{options}}" as="opt" hint-placeholder-count="2">
      <button type="button" onClick="{{ opt.pick }}" aria-pressed="{{ opt.pressed }}" style="{{ opt.boxStyle }}">
        <div style="{{ opt.thumbStyle }}">
          <span style="font-size: 12px; color: #eef2f0; background: rgba(16,20,22,0.7); padding: 4px 8px; border-radius: 8px">{{ opt.thumbLabel }}</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 4px; text-align: left">
            <span style="font-size: 18px; font-weight: 600; color: #eef2f0">{{ opt.title }}</span>
            <span style="font-size: 14px; line-height: 1.35; color: #a9b3b0">{{ opt.sub }}</span>
          </div>
          <div style="{{ opt.radioStyle }}"></div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Maak.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #8fe3b8; color: #0d1f17; font-size: 17px; font-weight: 600; text-decoration: none">Verder</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'video' }; }
  renderVals() {
    const base = [
      { id: 'foto', title: 'Hier', sub: 'Je foto doet de beweging uit de video na.', thumbLabel: 'jouw foto', tint: '#2b3a46' },
      { id: 'video', title: 'In de video', sub: 'Je foto neemt de plaats in van iemand in de video.', thumbLabel: 'jouw video', tint: '#3a2f46' }
    ];
    return {
      options: base.map((o) => {
        const on = this.state.picked === o.id;
        return {
          ...o,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ picked: o.id }),
          boxStyle: 'display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:18px;background:#1a2023;font:inherit;cursor:pointer;width:100%;box-sizing:border-box;border:2px solid ' + (on ? '#8fe3b8' : '#2e383c'),
          thumbStyle: 'height:150px;border-radius:12px;display:flex;align-items:flex-end;justify-content:flex-start;padding:10px;box-sizing:border-box;background:' + o.tint,
          radioStyle: 'width:24px;height:24px;border-radius:12px;flex-shrink:0;box-sizing:border-box;' + (on ? 'border:7px solid #8fe3b8;background:#101416' : 'border:2px solid #5c686c')
        };
      })
    };
  }
}
</script>
</body>
</html>
