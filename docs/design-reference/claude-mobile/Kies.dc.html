<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>RIG foto en video kiezen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8fe3b8}a:hover{color:#b6f0d2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #101416; color: #eef2f0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Main.dc.html" aria-label="Terug" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eef2f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 13px; color: #a9b3b0">Stap 1 van 3</span>
    <span style="width: 32px"></span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: -10px">
    <div style="height: 4px; border-radius: 2px; background: #8fe3b8"></div>
    <div style="height: 4px; border-radius: 2px; background: #2e383c"></div>
    <div style="height: 4px; border-radius: 2px; background: #2e383c"></div>
  </div>

  <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1">Kies je foto en video</h1>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 600">Wie moet erin?</span>
    <div style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: #1a2023; border: 1px solid #2e383c">
      <div style="width: 84px; height: 104px; border-radius: 12px; background: #2b3a46; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c9d6df" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
        <span style="font-size: 15px; font-weight: 500">mijn-hond.jpg</span>
        <span style="font-size: 13px; color: #a9b3b0; line-height: 1.35">Automatisch bijgesneden</span>
      </div>
      <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #2e383c; background: transparent; color: #eef2f0; font: inherit; font-size: 14px">Wijzig</button>
    </div>
    <span style="font-size: 13px; color: #a9b3b0">Tip: een duidelijke foto, liefst het hele lichaam.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; font-weight: 600">Welke video?</span>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 10px; border-radius: 16px; background: #1a2023; border: 1px solid #2e383c">
      <div style="height: 170px; border-radius: 12px; background: #3a2f46; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d9cfe3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5l5 3.5-5 3.5z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
        <div style="position: relative; height: 36px; border-radius: 8px; background: #232b2f">
          <div style="position: absolute; left: 22%; width: 34%; top: 0; bottom: 0; border-radius: 8px; border: 3px solid #8fe3b8; box-sizing: border-box; background: rgba(143,227,184,0.12)"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #a9b3b0">
          <span>Schuif om het stukje te kiezen</span>
          <span style="color: #eef2f0; font-weight: 600">5 sec</span>
        </div>
      </div>
    </div>
  </div>

  <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 4px; border: 0; background: transparent; color: #a9b3b0; font: inherit; font-size: 14px">
    <span>Meer opties (bijsnijden, close-up, hoeken)</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>

  <div style="flex-grow: 1"></div>
  <a href="Waar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #8fe3b8; color: #0d1f17; font-size: 17px; font-weight: 600; text-decoration: none">Verder</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
