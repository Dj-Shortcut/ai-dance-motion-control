plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'dev.andyarijs.rig'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.andyarijs.rig'
        minSdk 28
        targetSdk 36
        versionCode 5
        versionName '0.2.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Test-only, generated color blocks/tone. Customer or binary media is never tracked.
def fixtureOutput = layout.buildDirectory.file('generated/rigTestAssets/native-media-fixture.mp4')
def generateRigMediaFixture = tasks.register('generateRigMediaFixture', Exec) {
    inputs.file(rootProject.file('scripts/create-media-test-fixture.sh'))
    outputs.file(fixtureOutput)
    commandLine 'sh', rootProject.file('scripts/create-media-test-fixture.sh').absolutePath, fixtureOutput.get().asFile.absolutePath
}
android.sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir('generated/rigTestAssets'))
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('AndroidTestAssets')) dependsOn(generateRigMediaFixture)
}
