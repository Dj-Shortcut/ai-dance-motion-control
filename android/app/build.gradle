plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.andyarijs.rig'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.andyarijs.rig'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Release signing is supplied outside this repository, never embedded here.
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation project(':rigPlayBilling')
}

